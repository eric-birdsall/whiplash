<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Whiplash" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A 2D grappling-hook runner. Never stop running." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <title>Whiplash</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pause-btn" class="hidden" aria-label="Pause">❚❚</button>

  <div id="title" class="screen">
    <h1>WHIPLASH</h1>
    <p class="tag">Never stop running.</p>
    <button data-action="play" class="primary">Run</button>
    <p class="best" id="title-best"></p>
    <p class="controls desktop-only">W to jump (again in the air to double jump) · E or click to grapple, hold to swing · R restart · Esc pause</p>
    <p class="controls touch-only">Tap the left half to jump (again in the air to double jump) · Tap the right half to grapple, hold to swing</p>
    <p class="build"><span id="build-info"></span> · <button type="button" class="link" data-action="hard-reload">⟳ Reload latest</button></p>
  </div>

  <div id="pause" class="screen hidden">
    <h2>Paused</h2>
    <button data-action="resume" class="primary">Resume</button>
    <button data-action="restart">Restart</button>
    <button data-action="mute" id="mute-btn">Sound: on</button>
    <button data-action="title">Menu</button>
  </div>

  <div id="over" class="screen hidden">
    <h2>Run over</h2>
    <p id="over-stats"></p>
    <button data-action="play" class="primary">Run again</button>
    <button data-action="title">Menu</button>
  </div>

  <div id="rotate" class="hidden">
    <div class="phone">📱</div>
    <p>Turn your device sideways</p>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
